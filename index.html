<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - Muebles Elizabeth</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛋️ Catálogo Eli</h1>
            <p>Descubre nuestros mejores productos</p>
        </header>

        <div class="busqueda">
            <input type="text" id="busqueda" placeholder="Buscar productos...">
        </div>

        <div class="filtros">
            <button class="filtro-btn activo" data-filtro="todos">Todos</button>
            <button class="filtro-btn" data-filtro="muebleria">Mueblería</button>
            <button class="filtro-btn" data-filtro="colchoneria">Colchonería</button>
        </div>

        <div class="catalogo" id="catalogo">
            <!-- Los productos se cargarán aquí con JavaScript -->
        </div>

        <div class="sin-resultados" id="sinResultados" style="display: none;">
            😕 No se encontraron productos
        </div>
    </div>

    <button class="carrito-btn" id="carritoBtn">
        🛒
        <span class="carrito-contador" id="carritoContador">0</span>
    </button>

    <a href="https://wa.me/5493875803393?text=Hola%2C%20me%20gustaría%20obtener%20más%20información" target="_blank" class="whatsapp-flotante" title="Contáctanos por WhatsApp">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white">
            <path d="M12 0C5.4 0 0 5.4 0 12c0 2.1.5 4.1 1.5 5.9L0 24l6.3-1.5c1.8.9 3.9 1.5 6.1 1.5 6.6 0 12-5.4 12-12S18.6 0 12 0zm0 22c-1.9 0-3.8-.5-5.4-1.3l-.4-.2-4 1 1.2-3.8-.2-.4c-.9-1.7-1.4-3.6-1.4-5.5 0-5.5 4.5-10 10-10s10 4.5 10 10-4.5 10-10 10zm5.5-7.5c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.5-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.4.1-.6.1-.2.3-.3.4-.5.1-.2.1-.3 0-.5 0-.2-.5-1.2-.7-1.7-.2-.4-.3-.4-.6-.4h-.5c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4 0 1.4.6 2.8 1.6 3.9 1.2 1.4 2.9 2.3 4.6 2.5.6.1 1.2 0 1.7-.1.5 0 1.5-.6 1.7-1.2.2-.5.2-1 .1-1.2-.2-.3-.5-.4-.8-.5z"/>
        </svg>
    </a>

    <div class="modal" id="modalCarrito">
        <div class="modal-contenido">
            <button class="modal-close" onclick="cerrarCarrito()">✕</button>
            <h2>🛒 Mi Carrito</h2>
            <div class="carrito-items" id="carritoItems"></div>
            <button class="checkout-btn" onclick="consultarPorWhatsapp()">Consultar para más info</button>
        </div>
    </div>

    <script src="catalogo.js"></script>
    <script src="script.js"></script>
</body>
</html>
